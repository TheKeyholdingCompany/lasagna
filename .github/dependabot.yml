version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["patch", "minor", "major"]
    cooldown:
      default-days: 3
      semver-major-days: 14

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-deps:
        patterns: ["*"]
        update-types: ["patch", "minor", "major"]
    cooldown:
      default-days: 3
